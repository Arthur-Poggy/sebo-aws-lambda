<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sebo - Colaborador</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav><a href="cliente.html">Área do cliente</a></nav>
  <h1>Entrada de estoque</h1>
  <form id="form">
    <label>Código do livro
      <input id="id" required>
    </label>
    <label>Título
      <input id="titulo" required>
    </label>
    <label>Autor
      <input id="autor">
    </label>
    <label>Quantidade (negativa registra saída)
      <input id="quantidade" type="number" step="1" value="1" required>
    </label>
    <button id="enviar" type="submit">Registrar</button>
  </form>
  <div id="resultado" class="msg"></div>

  <h2>Estoque</h2>
  <table id="estoque">
    <thead>
      <tr><th>Código</th><th>Título</th><th>Autor</th><th>Qtd</th></tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="erro-estoque" class="msg"></div>
  <button id="atualizar" type="button">Atualizar</button>

  <script src="config.js"></script>
  <script>
    const form = document.getElementById("form");
    const botao = document.getElementById("enviar");
    const resultado = document.getElementById("resultado");
    const erroEstoque = document.getElementById("erro-estoque");
    const corpoTabela = document.querySelector("#estoque tbody");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const quantidade = Number(document.getElementById("quantidade").value);
      if (!Number.isInteger(quantidade)) {
        mostrar(resultado, "erro", "A quantidade deve ser um número inteiro.");
        return;
      }
      botao.disabled = true;
      try {
        const { status, dados } = await chamar(CONFIG.URL_CADASTRAR, {
          id: document.getElementById("id").value.trim(),
          titulo: document.getElementById("titulo").value.trim(),
          autor: document.getElementById("autor").value.trim(),
          quantidade,
        });
        if (status === 200) {
          const falhas = dados.falhas || [];
          if (falhas.length > 0) {
            mostrar(resultado, "espera", "Estoque atualizado, mas não foi possível avisar: " + falhas.join(", ") + ". Eles continuam na lista de espera.");
          } else {
            mostrar(resultado, "ok", "Estoque atualizado. Clientes avisados: " + (dados.clientes_avisados || []).length + ".");
          }
          carregarEstoque();
        } else if (status === 409) {
          mostrar(resultado, "erro", "Estoque insuficiente para essa saída.");
        } else {
          mostrar(resultado, "erro", dados.erro || "Erro " + status + ".");
        }
      } catch {
        mostrar(resultado, "erro", "Não foi possível falar com o servidor.");
      } finally {
        botao.disabled = false;
      }
    });

    function linha(livro) {
      const tr = document.createElement("tr");
      for (const valor of [livro.id, livro.titulo, livro.autor, livro.quantidade]) {
        const td = document.createElement("td");
        td.textContent = valor;
        tr.append(td);
      }
      return tr;
    }

    async function carregarEstoque() {
      try {
        const livros = await listarLivros();
        corpoTabela.replaceChildren(...livros.map(linha));
        erroEstoque.className = "msg";
      } catch {
        mostrar(erroEstoque, "erro", "Não foi possível carregar o estoque.");
      }
    }

    document.getElementById("atualizar").addEventListener("click", carregarEstoque);
    carregarEstoque();
  </script>
</body>
</html>
